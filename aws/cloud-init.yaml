#cloud-config
# cloud-init (EC2 User-Data) für einen minimalen JanuaPort-Startpunkt auf AWS
# (Ubuntu-AMI) — JanuaPort/januaport#776.
#
# COMMUNITY-VORLAGE, von JanuaPort GmbH NICHT BETRIEBEN, UNGETESTET.
#
# Installiert Docker + Compose-Plugin und legt einen minimalen Ein-Container-
# Stack + eine .env-Vorlage unter /opt/jnpt ab. Startet die Anlage BEWUSST
# NICHT automatisch. Die .env nennt ein festes Beispiel-Image, aber noch
# keine betreiberspezifischen Werte. Nach dem
# ersten Boot: /opt/jnpt/.env mit echten Werten füllen (siehe
# ../compose/.env.example für die vollständige Liste der Betreiber-Envs), dann
# von Hand starten — Schritte in README.md.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg

write_files:
  # Docker-APT: identischer Pruefhelfer wie Hetzner (#1500, SEC R4 B1).
  - path: /opt/jnpt/apt-schluessel.sh
    permissions: "0700"
    owner: root:root
    content: |
      #!/bin/sh
      # Aufruf: apt-schluessel.sh <https-url> <fingerabdruck, 40 Hex> <ziel>
      set -eu
      url=$1
      soll=$2
      ziel=$3
      arbeit=$(mktemp -d)
      trap 'rm -rf "$arbeit"' EXIT
      curl -fsSL --proto '=https' -o "$arbeit/schluessel" "$url"
      ist=$(GNUPGHOME="$arbeit" gpg --batch --show-keys --with-colons "$arbeit/schluessel" | awk -F: '$1 == "pub" { p = 1; next } p && $1 == "fpr" { print $10; p = 0 }')
      if [ "$ist" != "$soll" ]; then
        echo "apt-schluessel: $url hat [$ist], erwartet [$soll] - nicht vertraut" >&2
        exit 1
      fi
      install -m 0644 "$arbeit/schluessel" "$ziel"

  # Minimaler Ein-Container-Stack, bewusst identisch zu compose/docker-compose.yml
  # im Repo-Root (Loopback-Bind, Pflicht-Image-Tag, kein Healthcheck — Begründung
  # dort). Wer mehr Betreiber-Envs braucht (SSO, Anbindungsweg, …), ersetzt diese
  # Datei durch compose/docker-compose.yml + compose/.env.example aus dem Repo.
  - path: /opt/jnpt/docker-compose.yml
    permissions: "0644"
    owner: root:root
    content: |
      name: jnpt
      services:
        jnpt:
          image: ${JANUAPORT_IMAGE:?JANUAPORT_IMAGE in der .env setzen, z. B. ghcr.io/januaport/januaport:0.104.0}
          ports:
            - "127.0.0.1:8484:8484"
          environment:
            JNPT_MASTER_KEY: ${JNPT_MASTER_KEY:-}
          volumes:
            - jnpt-data:/data
          restart: unless-stopped
      volumes:
        jnpt-data:

  - path: /opt/jnpt/.env.example
    permissions: "0644"
    owner: root:root
    content: |
      # .env liegt daneben mit Modus 0600 bereit; dort Werte
      # eintragen. Vollständige Liste der Betreiber-Envs (SSO, Anbindungsweg,
      # Verzeichnisse): ../compose/.env.example im Repo.
      JANUAPORT_IMAGE=ghcr.io/januaport/januaport:0.104.0
      JNPT_MASTER_KEY=

runcmd:
  # --- Docker Engine + Compose-Plugin (offizielles Repo) ---------------------
  - install -m 0755 -d /etc/apt/keyrings
  - /opt/jnpt/apt-schluessel.sh https://download.docker.com/linux/ubuntu/gpg 9DC858229FC7DD38854AE2D88D81803C0EBFCD88 /etc/apt/keyrings/docker.asc && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - install -m 0600 /opt/jnpt/.env.example /opt/jnpt/.env
  - 'echo "JanuaPort-Startpunkt - Docker ist bereit. /opt/jnpt/.env mit echten Werten fuellen, danach docker compose -f /opt/jnpt/docker-compose.yml --env-file /opt/jnpt/.env up -d" > /etc/motd'
